# Сайт игры YUI. HTTPS сюда добавляет certbot (certbot --nginx -d yui.com.ru),
# поэтому после его запуска файл на сервере отличается от этого образца.
server {
    listen 80;
    server_name yui.com.ru;

    root /var/www/yui;
    index index.html;

    # Игровой сервер (PM2-процесс yui)
    location /ws {
        proxy_pass http://127.0.0.1:8790;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 86400;
    }
    location = /health {
        proxy_pass http://127.0.0.1:8790/health;
    }

    # В именах этих файлов есть хеш сборки, их можно кэшировать надолго
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
