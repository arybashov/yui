# Данные сервера YUI для общей админки RRaM (rram.com.ru/admin, переключатель RRaM / YUI).
# Кладётся в /etc/nginx/snippets/yui-admin.conf и подключается внутри server { listen 443 }
# сайта rram.com.ru строкой `include /etc/nginx/snippets/yui-admin.conf;` перед `location ^~ /admin`.
#
# Доступ — только при наличии сессионной куки админки RRaM. Апстриму (сервер YUI на 127.0.0.1:8790)
# уходит общий логин/пароль админки: __B64__ = base64("ADMIN_USER:ADMIN_PASSWORD").
# Реальный файл с подставленным значением хранится только на сервере (chmod 600).

location = /admin/yui-data {
    if ($http_cookie !~ "rram_admin=[0-9a-f]{64}") { return 403; }
    proxy_pass http://127.0.0.1:8790/admin/data;
    proxy_set_header Host $host;
    proxy_set_header Authorization "Basic __B64__";
    proxy_http_version 1.1;
}

location = /admin/yui-stats {
    if ($http_cookie !~ "rram_admin=[0-9a-f]{64}") { return 403; }
    proxy_pass http://127.0.0.1:8790/admin/stats$is_args$args;
    proxy_set_header Host $host;
    proxy_set_header Authorization "Basic __B64__";
    proxy_http_version 1.1;
}
