<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#24150c" />
    <title>YUI</title>
    <link rel="icon" href="/favicon.ico" sizes="16x16 32x32 48x48" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <style>
      /* Сплэш студии, как загрузочный экран «Городков»: виден сразу, пока грузится игра.
         Фон — ровно цвет фона картинки, иначе вокруг неё на любом экране видна рамка. */
      #splash {
        position: fixed;
        inset: 0;
        z-index: 100;
        display: grid;
        place-items: center;
        background: #221a15;
        transition: opacity 0.4s ease;
      }
      #splash img {
        width: min(72vmin, 520px);
        height: auto;
      }
      #splash.gone {
        opacity: 0;
        pointer-events: none;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <div id="splash"><img src="/splash.webp" alt="Hedgehog Group" /></div>
    <script>
      // Файл открыт прямо с диска: без сервера игра не загрузится, и страница была бы пустой.
      if (location.protocol === 'file:') {
        document.getElementById('splash').remove();
        document.body.style.cssText =
          'margin:0;min-height:100vh;display:grid;place-items:center;background:#24150c;color:#f7ecd9;font-family:Segoe UI,system-ui,sans-serif';
        document.getElementById('root').innerHTML =
          '<div style="max-width:440px;padding:24px;text-align:center;line-height:1.5">' +
          '<h1 style="color:#f2c14e;margin:0 0 12px">YUI</h1>' +
          '<p>Игра не открывается как файл. Запустите <b>start.bat</b> в папке игры — ' +
          'он включит сервер и откроет игру в браузере.</p>' +
          '<p>Если сервер уже запущен, откройте адрес<br><b>http://localhost:5173</b></p></div>';
      }
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
