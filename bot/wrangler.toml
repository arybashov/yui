# Бот @yui_cards_bot на Cloudflare Workers (bot/worker.js). Выкладка: cd bot && npx wrangler deploy
name = "yui-bot"
main = "worker.js"
compatibility_date = "2026-10-01"
workers_dev = true
# временные адреса версий не нужны: бот один, адрес один
preview_urls = false

[vars]
GAME_URL = "https://yui.com.ru/tg/"
BOT_USERNAME = "yui_cards_bot"
# куда писать с вопросами об оплате (ответ на /paysupport)
SUPPORT_EMAIL = "arybashov@gmail.com"

# список поддержавших; id — из «npx wrangler kv namespace create SUPPORTERS»
[[kv_namespaces]]
binding = "SUPPORTERS"
id = "834c938cae174c91888b1a47a4bf97f6"
